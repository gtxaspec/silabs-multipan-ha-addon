---
version: 3.1.1
slug: silabs_multipan
name: Silicon Labs Multiprotocol + Bluetooth
description: Zigbee, Thread and Bluetooth on one Silicon Labs multiprotocol RCP
arch:
  - amd64
homeassistant: 2024.1.0
init: false
startup: services
boot: auto
hassio_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:access-point-network
panel_title: OpenThread
host_dbus: true
host_network: true
host_uts: true
uart: true
discovery:
  - otbr
privileged:
  - IPC_LOCK
  - NET_ADMIN
  - NET_RAW
options:
  baudrate: "460800"
  flow_control: false
  zigbee_enable: true
  otbr_enable: true
  otbr_log_level: notice
  otbr_firewall: true
  bluetooth_enable: true
  bluetooth_max_scan_duty: 25
  cpcd_trace: false
ports:
  9999/tcp: null
  8081/tcp: null
ports_description:
  9999/tcp: EmberZNet EZSP/ASH port
  8081/tcp: OpenThread REST API port
schema:
  device: device(subsystem=tty)?
  network_device: str?
  baudrate: list(57600|115200|230400|460800|921600)
  flow_control: bool
  zigbee_enable: bool
  otbr_enable: bool
  otbr_log_level: list(debug|info|notice|warning|error|critical|alert|emergency)
  otbr_firewall: bool
  bluetooth_enable: bool
  bluetooth_max_scan_duty: int(1,100)
  cpcd_trace: bool
